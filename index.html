    if (qIndex >= 0) {

      params._path = urlSafeDecode(pathParam);

    // url looks like 'https://game.com/path?query=1#hash'
    // addHash looks like 'tgShareScoreUrl=' + encodeURIComponent('tgb://share_game_score?hash=very_long_hash123')

    var ind = url.indexOf('#');
    if (ind < 0) {
      // https://game.com/path -> https://game.com/path#tgShareScoreUrl=etc
      return url + '#' + addHash;
    }
    var curHash = url.substr(ind + 1);
    if (curHash.indexOf('=') >= 0 || curHash.indexOf('?') >= 0) {
      // https://game.com/#hash=1 -> https://game.com/#hash=1&tgShareScoreUrl=etc
      // https://game.com/#path?query -> https://game.com/#path?query&tgShareScoreUrl=etc
      return url + '&' + addHash;

      var iframeEl = document.createElement('iframe');

      var pageHidden = false;

      if (iframeEl !== null) {

      setTimeout(function() {

    }
    if (!message.length) {
      console.error('[Telegram.WebApp] Popup message is required', params.message);
      throw Error('WebAppPopupParamInvalid');
    }
    if (message.length > 256) {
      console.error('[Telegram.WebApp] Popup message is too long', message);
      throw Error('WebAppPopupParamInvalid');

    if (typeof params.buttons !== 'undefined') {
      if (!Array.isArray(params.buttons)) {
        console.error('[Telegram.WebApp] Popup buttons should be an array', params.buttons);
        throw Error('WebAppPopupParamInvalid');
      }
      for (var i = 0; i < params.buttons.length; i++) {
        var button = params.buttons[i];

          id = button.id.toString();
          if (id.length > 64) {
            console.error('[Telegram.WebApp] Popup button id is too long', id);
            throw Error('WebAppPopupParamInvalid');
          }
        }
        btn.id = id;
        var button_type = button.type;
        if (typeof button_type === 'undefined') {
          button_type = 'default';
        }
        btn.type = button_type;
        if (button_type == 'ok' ||
            button_type == 'close' ||
            button_type == 'cancel') {
          // no params needed
        } else if (button_type == 'default' ||
                   button_type == 'destructive') {
          var text = '';
          if (typeof button.text !== 'undefined') {
            text = strTrim(button.text);
          }
          if (!text.length) {
            console.error('[Telegram.WebApp] Popup button text is required for type ' + button_type, button.text);

      console.error('[Telegram.WebApp] Popup should not have more than 3 buttons');
      throw Error('WebAppPopupParamInvalid');

<script id="early-theme">
(function () {
  // По умолчанию тёмная. Светлую включаем только если Telegram реально
  // прислал светлый themeParams.bg_color. Пока тема не пришла, colorScheme
  // часто равен 'light' просто как значение по умолчанию — ему верить нельзя.
  var scheme = 'dark';
  try { var cached = localStorage.getItem('smus-theme'); if (cached === 'light' || cached === 'dark') scheme = cached; } catch (e) {}
  function isDark(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return true;
    var n = parseInt(m[1], 16);
    return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000 < 128;
  }
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    var bg = tg && tg.themeParams && tg.themeParams.bg_color;
    if (bg) scheme = isDark(bg) ? 'dark' : 'light';
    else if (tg && tg.colorScheme === 'dark') scheme = 'dark';
    var c = scheme === 'light' ? '#f4f5fa' : '#0c0d12';
    try { tg && tg.setBackgroundColor && tg.setBackgroundColor(c); } catch (e) {}
    try { tg && tg.setHeaderColor && tg.setHeaderColor(c); } catch (e) {}
  } catch (e) {}
  document.documentElement.dataset.theme = scheme;
  try { localStorage.setItem('smus-theme', scheme); } catch (e) {}
})();
</script>

.me b{display:block;color:var(--fg);font-size:13px;font-weight:600}

/* ---------- setup ---------- */
.setup{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.setup .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 6px 2px;font-weight:600}
.selectwrap{position:relative}
.selectwrap::after{
  content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;margin-top:-6px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none;
}
select{
  width:100%;appearance:none;background:var(--card2);color:var(--fg);
  border:1px solid var(--line);border-radius:12px;padding:11px 38px 11px 12px;
  font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
select:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.row .group{flex:1 1 150px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--muted);
  font:inherit;font-weight:600;font-size:14px;min-width:42px;padding:9px 12px;border-radius:11px;cursor:pointer;
  transition:transform .15s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 16px -10px var(--accent)}
.chip:hover:not([aria-pressed="true"]){border-color:color-mix(in oklab, var(--accent) 40%, var(--line));color:var(--fg)}
.chips.samples .chip{
  flex:0 1 auto;min-width:0;max-width:100%;
  font-size:13px;padding:8px 11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}

/* ---------- next banner ---------- */
.nextbar{
  display:flex;align-items:center;gap:12px;margin-top:12px;padding:13px 14px;border-radius:16px;
  background:linear-gradient(135deg, color-mix(in oklab, var(--accent) 22%, var(--card)), var(--card));
  border:1px solid color-mix(in oklab, var(--accent) 32%, var(--line));
}
.nextbar .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px color-mix(in oklab, var(--ok) 22%, transparent)}
.nextbar.idle .dot{background:var(--muted);box-shadow:none}
.nextbar.live .dot{background:var(--warn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.nextbar .txt{min-width:0;font-size:13px;color:var(--muted)}
.nextbar .txt b{display:block;color:var(--fg);font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextbar .time{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}

/* ---------- day ---------- */
.dayhead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 10px}
.dayhead h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.dayhead .date{color:var(--muted);font-size:13px}
.pill{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.muted{color:var(--dim);background:color-mix(in oklab, var(--dim) 12%, transparent)}

/* ---------- pair card ---------- */
.pair{
  display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.pair::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.pair.now::before{background:var(--warn)}
.pair.next::before{background:var(--accent)}
.pair.past{opacity:.62}
.pair.now{background:linear-gradient(135deg, color-mix(in oklab, var(--warn) 12%, var(--card)), var(--card));border-color:color-mix(in oklab, var(--warn) 35%, var(--line))}
.pair.next{border-color:color-mix(in oklab, var(--accent) 30%, var(--line))}
.pair .t{font-variant-numeric:tabular-nums;line-height:1.15}
.pair .t .a{font-size:16.5px;font-weight:700;letter-spacing:.2px}
.pair .t .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.pair .t .n{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.pair .body{min-width:0}
.subj{font-size:15.5px;font-weight:650;letter-spacing:.15px;margin:0 0 4px;word-break:break-word}
.code{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--accent);display:inline-block;margin-bottom:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 7px;white-space:nowrap}
.tag.room{color:var(--fg);font-weight:600}
.tag.sub{color:var(--accent);border-color:color-mix(in oklab, var(--accent) 30%, var(--line));background:var(--accent-soft);font-weight:700}
.tag.hour{color:var(--warn);border-color:color-mix(in oklab, var(--warn) 30%, var(--line));background:color-mix(in oklab, var(--warn) 10%, transparent);font-weight:600}
.badge{align-self:start;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pair.now .badge{background:color-mix(in oklab, var(--warn) 18%, transparent);color:var(--warn)}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in oklab, var(--warn) 20%, transparent)}
.bar i{display:block;height:100%;background:var(--warn);transition:width 1s linear}

/* ---------- search ---------- */
.searchbar{position:relative;margin-top:14px}
.searchbar svg.ic{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round;pointer-events:none;
}
.searchbar input{
  width:100%;appearance:none;-webkit-appearance:none;background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:14px;
  padding:13px 44px;font:inherit;font-size:15px;box-shadow:var(--shadow);
}
.searchbar input::-webkit-search-cancel-button,.searchbar input::-webkit-search-decoration{display:none}
.searchbar input::placeholder{color:var(--dim)}
.searchbar input:focus{outline:none;border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar .clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);
  font-size:18px;line-height:1;cursor:pointer;
}
.searchbar .clear:hover{color:var(--fg)}
.scope{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dayfilter{
  display:flex;gap:6px;margin-top:14px;padding-bottom:2px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pinch-zoom;
}
.dayfilter::-webkit-scrollbar{display:none}
.dayfilter .chip{flex:0 0 auto;min-width:0;padding:7px 11px;font-size:13px;border-radius:10px}
.scope .chip,.scope .chip[aria-pressed="true"]{flex:0 0 auto}
.sres{
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;margin-bottom:7px;
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.sres:hover{border-color:color-mix(in oklab,var(--accent) 38%,var(--line));background:var(--card2)}
.sres .top{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--dim)}
.sres .top .g{
  margin-left:auto;color:var(--accent);font-weight:600;text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:60%;
}
.sres .sb{display:block;font-size:14.5px;font-weight:650;margin:3px 0 3px;line-height:1.3;overflow-wrap:anywhere}
.sres .mt{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
mark{background:color-mix(in oklab,var(--accent) 36%,transparent);color:var(--fg);border-radius:4px;padding:0 2px}
.hint{color:var(--dim);font-size:11.5px;text-align:center;margin:10px 0 4px;line-height:1.55}

/* ---------- easter egg ---------- */
.egg{margin:26px 0 4px}
.egg[hidden]{display:none}
.egg img{
  display:block;width:100%;height:auto;
  border-radius:var(--radius);border:1px solid var(--line);
  box-shadow:var(--shadow);background:var(--card);
}

/* ---------- empty / week ---------- */
.empty{
  text-align:center;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--radius);
  color:var(--muted);background:color-mix(in oklab, var(--card) 55%, transparent);
}
.empty .big{font-size:26px;display:block;margin-bottom:6px}
.weekday{margin-top:16px}
.weekday h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--muted)}
.weekday h3 .wd{text-transform:capitalize}
.weekday h3 .d{color:var(--dim);font-weight:500;font-size:12.5px}
.weekday.today h3{color:var(--fg)}
.weekday.today h3::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.free{color:var(--dim);font-size:13px;padding:2px 2px 0}
footer{color:var(--dim);font-size:11.5px;text-align:center;margin:26px 0 10px;line-height:1.6}

/* ---------- bottom nav ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
nav.bottom .inner{max-width:680px;margin:0 auto;display:flex;gap:8px}
nav.bottom button{
  flex:1;appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
  font:inherit;font-size:12px;font-weight:650;padding:7px 4px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
}
nav.bottom button:active{transform:scale(.94)}
nav.bottom button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--fg);background:var(--card);border-color:var(--line)}
nav.bottom button[aria-current="page"] svg{stroke:var(--accent)}

/* ---------- motion ---------- */
@keyframes viewInRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes viewInLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#view.enter-right{animation:viewInRight .3s cubic-bezier(.22,.61,.36,1) both}
#view.enter-left{animation:viewInLeft .3s cubic-bezier(.22,.61,.36,1) both}
#view{touch-action:pan-y pinch-zoom}
#view.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
#view.dragging .pair,#view.dragging .sres{transition:none;transform:none}
.swipe-ghost{will-change:transform}
#view.anim > *{animation:riseIn .42s cubic-bezier(.22,.61,.36,1) both}
#view.anim > *:nth-child(2){animation-delay:.04s}
#view.anim > *:nth-child(3){animation-delay:.08s}
#view.anim > *:nth-child(4){animation-delay:.12s}
#view.anim > *:nth-child(5){animation-delay:.16s}
#view.anim > *:nth-child(n+6){animation-delay:.2s}
@media (hover:hover){
  .pair:hover{transform:translateY(-1px);box-shadow:0 14px 34px -20px #000}
  .sres:hover{transform:translateY(-1px)}
}
.pair:active{transform:scale(.995)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

@media (max-width:460px){
  .brand p{display:none}
  .brand h1{font-size:14px}
  .me{white-space:nowrap}
  .row .group{flex:1 1 100%}
  .chip{min-width:40px;padding:9px 10px;flex:1}
  .chip[aria-pressed="true"]{flex:1}
}
@media (max-width:400px){
  .pair{grid-template-columns:56px 1fr;gap:10px}
  .badge{position:absolute;top:10px;right:10px}
  .pair .body{padding-right:44px}
}
</style>

const DAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const KEY = 'smu-schedule-v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch {} }
};

const state = Object.assign({ spec: 0, course: '1', sub: null, tab: 'today' }, store.load());
if (!SPECS[state.spec]) state.spec = 0;

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const m = /^(\d{1,2})[.:](\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
const fmtMin = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const hm = t => String(t || '').replace(/(\d{1,2})\.(\d{2})/g, '$1:$2');
function nowMin(d = new Date()) { return d.getHours() * 60 + d.getMinutes(); }
function dayIdx(d = new Date()) { return (d.getDay() + 6) % 7; }

function spec() { return SPECS[state.spec]; }
function dayFor(s, idx) { return s.days.find(d => d.name === DAYS[idx]) || null; }

function subgroupsFor(s, course) {
  const set = new Set();
  s.days.forEach(d => d.pairs.forEach(p => (p.cells[course] || []).forEach(e => e.subgroups.forEach(g => set.add(g)))));
  return [...set].sort();
}

function entriesFor(pair, course, sub) {
  const list = pair.cells[course] || [];
  if (!sub) return list;
  return list.filter(e => !e.subgroups.length || e.subgroups.includes(sub));
}

// реальные границы занятий группы: у пары может быть только 2-й час (8:55–9:40) и т.п.
function pairSpan(pair, entries) {
  let a = Infinity, b = -Infinity;
  (entries || []).forEach(e => {
    (e.hours || []).forEach(n => {
      const h = pair.hours[n];
      if (!h) return;
      const s = toMin(h.start), z = toMin(h.end);
      if (!Number.isNaN(s)) a = Math.min(a, s);
      if (!Number.isNaN(z)) b = Math.max(b, z);
    });
  });
  if (!isFinite(a)) a = toMin(pair.start);
  if (!isFinite(b)) b = toMin(pair.end);
  return { a, b };
}

function cleanSubject(s) {
  s = String(s || '').trim();
  // код начинается с заглавных букв/цифр, название — с заглавной+строчных
  const m = /[А-ЯЁ][а-яё]{1,}/.exec(s);
  if (m && m.index > 0) {
    const code = s.slice(0, m.index).replace(/[\s.:-]+$/, '').replace(/\s+/g, ' ');
    const name = s.slice(m.index).replace(/^[\s.:-]+/, '');
    if (name) return { code, name };
  }
  // «ОП.07 БЖД» — код + аббревиатура
  const sp = s.lastIndexOf(' ');
  if (sp > 0) {
    const code = s.slice(0, sp).trim();
    const name = s.slice(sp + 1).trim();
    if (/^[А-ЯЁ]{2,6}[.\d\s]*$/.test(code) && name) return { code, name };
  }
  return { code: '', name: s };
}

function hourLabel(e, pair) {
  if (e.hours.length === 2) return '';
  const h = pair.hours[e.hours[0]];
  return h ? `${h.start}–${h.end}` : '';
}

function relative(minutes) {
  const abs = Math.abs(minutes);
  const h = Math.floor(abs / 60), m = abs % 60;
  const s = h ? `${h} ч${m ? ' ' + m + ' мин' : ''}` : `${m} мин`;
  return minutes >= 0 ? `через ${s}` : `${s} назад`;
}

/* ---------- render: selectors ---------- */
function renderSelectors() {
  const sel = $('#spec');
  sel.innerHTML = '';
  SPECS.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = s.short || s.name;
    sel.appendChild(o);
  });
  sel.value = String(state.spec);
  sel.onchange = () => { state.spec = +sel.value; state.sub = null; persist(); render(); };

  const s = spec();
  const maxCourse = Math.max(...s.days.flatMap(d => d.pairs.flatMap(p => Object.keys(p.cells)))) ;
  const courses = ['1', '2', '3', '4'];
  const cw = $('#courses');
  cw.innerHTML = '';
  courses.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c;
    b.setAttribute('aria-pressed', String(state.course === c));
    b.onclick = () => { state.course = c; state.sub = null; persist(); render(); };
    cw.appendChild(b);
  });

  const subs = subgroupsFor(s, state.course);
  const subwrap = $('#subwrap');
  subwrap.hidden = subs.length === 0;
  const sw = $('#subs');
  sw.innerHTML = '';
  if (subs.length) {
    if (state.sub && !subs.includes(state.sub)) state.sub = null;
    const all = document.createElement('button');
    all.className = 'chip';
    all.textContent = 'все';
    all.style.minWidth = '58px';
    all.setAttribute('aria-pressed', String(!state.sub));
    all.onclick = () => { state.sub = null; persist(); render(); };
    sw.appendChild(all);
    subs.forEach(g => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = g;
      b.setAttribute('aria-pressed', String(state.sub === g));
      b.onclick = () => { state.sub = state.sub === g ? null : g; persist(); render(); };
      sw.appendChild(b);
    });
  }

  const me = $('#me');
  const n = DAYS_SHORT[dayIdx()];
  me.innerHTML = `<b>${state.course} курс${subs.length && state.sub ? ' · гр. ' + state.sub : ''}</b>${n}`;
}

/* ---------- render: pair card ---------- */
function pairCard(pair, course, sub, kind, now) {
  const entries = entriesFor(pair, course, sub);
  const span = pairSpan(pair, entries);
  const start = fmtMin(span.a);
  const end = fmtMin(span.b);
  if (!entries.length) {
    return `<article class="pair free ${kind === 'past' ? 'past' : ''}" style="grid-template-columns:64px 1fr">
      <div class="t"><div class="n">п. ${pair.n}</div><div class="a">${start}</div><div class="b">${end}</div></div>
      <div class="body"><p class="subj" style="color:var(--dim);font-weight:500">окно</p></div>
    </article>`;
  }
  const multi = entries.length > 1;
  const items = entries.map(e => {
    const { code, name } = cleanSubject(e.subject);
    const tags = [];
    if (e.room) tags.push(`<span class="tag room">${esc(e.room)}</span>`);
    if (e.teacher) tags.push(`<span class="tag">${esc(e.teacher)}</span>`);
    if (!sub && e.subgroups.length) tags.push(`<span class="tag sub">гр. ${e.subgroups.join(', ')}</span>`);
    const hl = multi ? hourLabel(e, pair) : '';
    if (hl) tags.push(`<span class="tag hour">${hm(hl)}</span>`);
    return `<div class="ent">
      ${code && multi ? `<span class="code">${esc(code)}</span>` : ''}
      <p class="subj">${code && !multi ? `<span class="code">${esc(code)}</span><br>` : ''}${esc(name)}</p>
      <div class="meta">${tags.join('')}</div>
    </div>`;
  }).join('');

  let badge = '';
  let bar = '';
  if (kind === 'now') {
    badge = `<span class="badge">сейчас</span>`;
    const pct = Math.max(0, Math.min(100, ((now - span.a) / (span.b - span.a)) * 100));
    bar = `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>`;
  } else if (kind === 'next') {
    badge = `<span class="badge">дальше</span>`;
  }
  return `<article class="pair ${kind}">
    <div class="t"><div class="n">п. ${pair.n}</div><div class="a">${start}</div><div class="b">${end}</div></div>
    <div class="body">${items}</div>
    ${badge}${bar}
  </article>`;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- render: today ---------- */
function renderToday() {
  const s = spec();
  const di = dayIdx();
  const day = dayFor(s, di);
  const now = nowMin();
  const today = new Date();
  const dateStr = `${today.getDate()} ${MONTHS[today.getMonth()]}`;

  let head = `<div class="dayhead"><h2>${di < 6 ? DAYS[di] : 'воскресенье'}</h2><span class="date">${dateStr}</span>`;
  let body = '';
  let prevKind = '';

  const pairs = day ? day.pairs : [];
  const mine = pairs.filter(p => entriesFor(p, state.course, state.sub).length);

  // статус пары (по реальному времени занятий группы, а не по сетке пар)
  const spanOf = p => pairSpan(p, entriesFor(p, state.course, state.sub));
  const stateOf = p => {
    const { a, b } = spanOf(p);
    if (now >= b) return 'past';
    if (now >= a) return 'now';
    return 'future';
  };
  const live = mine.find(p => stateOf(p) === 'now');
  const upcoming = mine.find(p => stateOf(p) === 'future');

  // баннер
  let banner = '';
  if (live) {
    const e = entriesFor(live, state.course, state.sub)[0];
    const sp = spanOf(live);
    banner = `<div class="nextbar live">
      <span class="dot"></span>
      <div class="txt"><b>${esc(cleanSubject(e.subject).name)}</b>идёт до ${fmtMin(sp.b)}${e.room ? ' · ' + esc(e.room) : ''}</div>
      <span class="time">${relative(sp.b - now).replace('через', 'ещё')}</span>
    </div>`;
  } else if (upcoming) {
    const e = entriesFor(upcoming, state.course, state.sub)[0];
    const sp = spanOf(upcoming);
    banner = `<div class="nextbar">
      <span class="dot"></span>
      <div class="txt"><b>${esc(cleanSubject(e.subject).name)}</b>в ${fmtMin(sp.a)}${e.room ? ' · ' + esc(e.room) : ''}</div>
      <span class="time">${relative(sp.a - now)}</span>
    </div>`;
  } else {
    const nd = nextStudyDay(s, di);
    if (mine.length) {
      banner = `<div class="nextbar idle"><span class="dot"></span><div class="txt"><b>На сегодня всё</b>следующие пары ${nd ? '— ' + DAYS[nd.idx] + ', ' + fmtMin(nd.start) : '— на следующей неделе'}</div></div>`;
    } else {
      banner = `<div class="nextbar idle"><span class="dot"></span><div class="txt"><b>Сегодня пар нет</b>${nd ? 'ближайшие — ' + DAYS[nd.idx] + ', ' + fmtMin(nd.start) : 'свободно'}</div></div>`;
    }
  }

  if (!day || !mine.length) {
    head += `<span class="pill muted">свободно</span></div>`;
    body = `<div class="empty"><span class="big">☕</span>${di === 6 ? 'Воскресенье — можно ничего не делать' : 'Пар нет'}</div>`;
  } else {
    head += `<span class="pill">${mine.length} ${plural(mine.length, 'пара', 'пары', 'пар')}</span></div>`;
    body = mine.map(p => {
      const k = stateOf(p);
      return pairCard(p, state.course, state.sub, k === 'future' && p === upcoming ? 'next' : k, now);
    }).join('');
  }

  const allPast = mine.length > 0 && mine.every(p => stateOf(p) === 'past');
  const nd = nextStudyDay(s, di);
  if (nd && (!mine.length || allPast)) body += nextDayBlock(nd);

  $('#view').innerHTML = banner + head + body;
}

function nextDayBlock(nd) {
  const today = new Date();
  const di = dayIdx();
  const d = new Date(today);
  d.setDate(today.getDate() + ((nd.idx - di + 7) % 7));
  const day = dayFor(spec(), nd.idx);
  const pairs = day ? day.pairs.filter(p => entriesFor(p, state.course, state.sub).length) : [];
  return `<div class="dayhead" style="margin-top:24px">
      <h2 style="font-size:15px">${DAYS[nd.idx]}</h2>
      <span class="date">${d.getDate()} ${MONTHS[d.getMonth()]}</span>
      <span class="pill muted">следующий учебный день</span>
    </div>` + pairs.map(p => pairCard(p, state.course, state.sub, '', -1)).join('');
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function nextStudyDay(s, di) {
  for (let k = 1; k <= 7; k++) {
    const idx = (di + k) % 7;
    const d = dayFor(s, idx);
    if (!d) continue;
    const p = d.pairs.find(p => entriesFor(p, state.course, state.sub).length);
    if (p) return { idx, pair: p, start: pairSpan(p, entriesFor(p, state.course, state.sub)).a };
  }
  return null;
}

/* ---------- render: week ---------- */
function renderWeek() {
  const s = spec();
  const di = dayIdx();
  const now = nowMin();
  const today = new Date();
  let html = '';
  DAYS.forEach((name, idx) => {
    const d = dayFor(s, idx);
    const date = new Date(today);
    date.setDate(today.getDate() + (idx - di));
    const pairs = d ? d.pairs : [];
    const mine = pairs.filter(p => entriesFor(p, state.course, state.sub).length);
    html += `<section class="weekday ${idx === di ? 'today' : ''}">
      <h3><span class="wd">${name}</span><span class="d">${date.getDate()} ${MONTHS[date.getMonth()]}</span>${idx === di ? '<span class="pill" style="margin-left:auto">сегодня</span>' : ''}</h3>`;
    if (!mine.length) html += `<div class="free">свободно</div>`;
    else html += mine.map(p => {
      const { a, b } = pairSpan(p, entriesFor(p, state.course, state.sub));
      const kind = idx === di ? (now >= b ? 'past' : now >= a ? 'now' : 'future') : '';
      return pairCard(p, state.course, state.sub, kind, now);
    }).join('');
    html += `</section>`;
  });
  $('#view').innerHTML = html;
}

/* ---------- render: search ---------- */
let searchQ = '';
let searchScope = 'all';
let searchDay = 'all';
let searchLimit = 60;
let IDX = null;

const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[\u00a0\s]+/g, ' ').trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function scheduleIndex() {
  if (IDX) return IDX;
  const map = new Map();
  SPECS.forEach((s, si) => {
    s.days.forEach((d, di) => {
      d.pairs.forEach(p => {
        Object.keys(p.cells).forEach(course => {
          (p.cells[course] || []).forEach(e => {
            const key = [si, course, di, p.n, e.subject, e.teacher, e.room, e.hours.join('-')].join('|');
            let it = map.get(key);
            if (!it) {
              it = {
                si, course, di, pair: p, subject: e.subject, teacher: e.teacher,
                room: e.room, hours: e.hours, subs: []
              };
              map.set(key, it);
            }
            e.subgroups.forEach(g => { if (!it.subs.includes(g)) it.subs.push(g); });
          });
        });
      });
    });
  });
  IDX = [...map.values()].map(it => {
    it.subs.sort();
    it.nsubj = norm(it.subject);
    it.nteach = norm(it.teacher);
    it.hay = norm(`${it.subject} ${it.teacher} ${it.room}`);
    return it;
  });
  return IDX;
}

function entryTime(pair, e) {
  if (e.hours.length === 1) {
    const h = pair.hours[e.hours[0]];
    if (h) return h;
  }
  return { start: pair.start, end: pair.end };
}

function inScope(it) {
  if (searchScope !== 'mine') return true;
  if (it.si !== state.spec || it.course !== state.course) return false;
  return !state.sub || !it.subs.length || it.subs.includes(state.sub);
}

function rankOf(it, tokens) {
  let sc = 0;
  tokens.forEach(t => {
    if (it.nsubj.startsWith(t)) sc += 0;
    else if (it.nsubj.includes(t)) sc += 2;
    else if (it.nteach.includes(t)) sc += 4;
    else sc += 8;
  });
  return sc;
}

function hl(text, tokens) {
  let out = esc(text);
  tokens.forEach(t => {
    if (!t) return;
    const re = new RegExp(escRe(t).replace(/е/g, '[её]'), 'gi');
    out = out.replace(re, m => `\u0001${m}\u0002`);
  });
  return out.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
}

function searchRow(it, tokens) {
  const t = entryTime(it.pair, it);
  const { code, name } = cleanSubject(it.subject);
  const day = DAYS_SHORT[it.di] || DAYS[it.di];
  const grp = [SPECS[it.si].short || SPECS[it.si].name, it.course + ' курс'];
  if (it.subs.length) grp.push('гр. ' + it.subs.join(','));
  const meta = [];
  if (it.room) meta.push(`<span class="tag room">${esc(it.room)}</span>`);
  if (it.teacher) meta.push(`<span class="tag">${hl(it.teacher, tokens)}</span>`);
  const sub = it.subs.length === 1 ? it.subs[0] : '';
  return `<button class="sres" data-si="${it.si}" data-course="${esc(it.course)}" data-sub="${esc(sub)}">
    <span class="top"><span>${day} · ${it.pair.n} пара · ${hm(t.start)}–${hm(t.end)}</span><span class="g">${esc(grp.join(' · '))}</span></span>
    <span class="sb">${code ? `<span class="code">${hl(code, tokens)}</span> ` : ''}${hl(name, tokens)}</span>
    <span class="mt">${meta.join('')}</span>
  </button>`;
}

function searchEmpty() {
  const groups = new Map();
  scheduleIndex().forEach(it => {
    const name = cleanSubject(it.subject).name;
    if (name.length > 11) return;
    if (!groups.has(name)) groups.set(name, new Set());
    groups.get(name).add(it.si + '-' + it.course);
  });
  const samples = [...groups.entries()].sort((a, b) => b[1].size - a[1].size).slice(0, 6)
    .map(x => x[0]).sort((a, b) => b.length - a.length);
  return `<div class="empty" style="margin-top:16px"><span class="big">🔍</span>
      Начни вводить предмет или фамилию преподавателя
    </div>
    <section class="setup" style="margin-top:10px">
      <p class="lbl">Например</p>
      <div class="chips samples">${samples.map(s => `<button class="chip" data-sample="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    </section>`;
}

function renderResults() {
  const box = $('#results');
  if (!box) return;
  const tokens = norm(searchQ).split(' ').filter(Boolean);
  if (!tokens.length) { box.innerHTML = searchEmpty(); return; }

  const dayNum = searchDay === 'all' ? -1 : +searchDay;
  const found = scheduleIndex()
    .filter(it => dayNum < 0 || it.di === dayNum)
    .filter(inScope)
    .filter(it => tokens.every(t => it.hay.includes(t)));

  if (!found.length) {
    box.innerHTML = `<div class="empty" style="margin-top:16px"><span class="big">${dayNum >= 0 ? '🗓️' : '🤷'}</span>${dayNum >= 0 ? 'В этот день ничего не найдено' : 'Ничего не найдено'}${searchScope === 'mine' ? '<br><button class="chip" id="allscope" style="margin-top:12px">Искать по всему училищу</button>' : ''}</div>`;
    return;
  }

  const sorted = found
    .map(it => ({ it, r: rankOf(it, tokens) }))
    .sort((a, b) => a.r - b.r || a.it.di - b.it.di || a.it.pair.n - b.it.pair.n ||
      a.it.nsubj.localeCompare(b.it.nsubj) || a.it.si - b.it.si ||
      (a.it.course < b.it.course ? -1 : a.it.course > b.it.course ? 1 : 0));

  const list = sorted.slice(0, searchLimit);
  box.innerHTML = `<div class="dayhead" style="margin-top:16px"><h2 style="font-size:14px">Найдено: ${found.length}</h2>
      ${found.length > list.length ? `<span class="pill muted">показаны ${list.length}</span>` : ''}</div>`
    + list.map(x => searchRow(x.it, tokens)).join('')
    + (found.length > list.length ? `<button class="chip" id="more" style="width:100%;margin-top:6px">Показать ещё</button>` : '')
    + `<p class="hint">Нажми на результат — откроется неделя этой группы</p>`;
}

function renderSearch() {
  $('#view').innerHTML = `
    <div class="dayfilter" id="dayfilter" role="group" aria-label="День недели">
      <button class="chip" data-day="all" aria-pressed="${searchDay === 'all'}">все дни</button>
      ${DAYS_SHORT.slice(0, 6).map((d, i) => `<button class="chip" data-day="${i}" aria-pressed="${searchDay === String(i)}">${d}</button>`).join('')}
    </div>
    <div class="searchbar">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Предмет или преподаватель" value="${esc(searchQ)}" aria-label="Поиск по расписанию">
      <button class="clear" id="qclear" aria-label="Очистить" ${searchQ ? '' : 'hidden'}>×</button>
    </div>
    <div class="scope" id="scope">
      <button class="chip" data-scope="all" aria-pressed="${searchScope === 'all'}">всё училище</button>
      <button class="chip" data-scope="mine" aria-pressed="${searchScope === 'mine'}">моя группа</button>
    </div>
    <div id="results"></div>`;

  const q = $('#q');
  q.addEventListener('input', () => {
    searchQ = q.value;
    searchLimit = 60;
    $('#qclear').hidden = !searchQ;
    renderResults();
  });
  q.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      q.value = '';
      searchQ = '';
      $('#qclear').hidden = true;
      renderResults();
    }
  });
  $('#qclear').onclick = () => {
    q.value = '';
    searchQ = '';
    $('#qclear').hidden = true;
    q.focus();
    renderResults();
  };
  $$('#scope [data-scope]').forEach(b => {
    b.onclick = () => {
      searchScope = b.dataset.scope;
      searchLimit = 60;
      $$('#scope [data-scope]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.scope === searchScope)));
      renderResults();
    };
  });

  $$('#dayfilter [data-day]').forEach(b => {
    b.onclick = () => {
      searchDay = b.dataset.day;
      searchLimit = 60;
      $$('#dayfilter [data-day]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.day === searchDay)));
      renderResults();
    };
  });

  $('#results').onclick = ev => {
    const sample = ev.target.closest('[data-sample]');
    if (sample) {
      searchQ = sample.dataset.sample;
      searchLimit = 60;
      q.value = searchQ;
      $('#qclear').hidden = false;
      renderResults();
      return;
    }
    if (ev.target.closest('#more')) {
      searchLimit += 60;
      renderResults();
      return;
    }
    if (ev.target.closest('#allscope')) {
      searchScope = 'all';
      $$('#scope [data-scope]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.scope === 'all')));
      renderResults();
      return;
    }
    const row = ev.target.closest('.sres');
    if (row) {
      state.spec = +row.dataset.si;
      state.course = row.dataset.course;
      state.sub = row.dataset.sub || null;
      state.tab = 'week';
      persist();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  renderResults();
}

/* ---------- orchestration ---------- */
function render(dir) {
  renderSelectors();
  $('#setup').hidden = state.tab === 'info';
  const egg = $('.egg');
  if (egg) egg.hidden = state.tab !== 'info';
  const view = $('#view');
  view.classList.remove('dragging', 'enter-left', 'enter-right', 'anim');
  clearTimeout(view._animTimer);
  view.style.transition = '';
  view.style.transform = '';
  view.style.opacity = '';
  view.style.animation = '';
  view.innerHTML = '';
  if (state.tab === 'week') renderWeek();
  else if (state.tab === 'search') renderSearch();
  else if (state.tab === 'info') renderInfo();
  else renderToday();
  void view.offsetWidth;
  if (dir === 'left') view.classList.add('enter-left');
  else if (dir === 'right') view.classList.add('enter-right');
  else view.classList.add('anim');
  clearTimeout(view._animTimer);
  view._animTimer = setTimeout(() => view.classList.remove('anim', 'enter-left', 'enter-right'), 780);
  $$('[data-tab]').forEach(b => {
    const on = b.dataset.tab === state.tab;
    if (b.getAttribute('role') === 'tab') b.setAttribute('aria-selected', String(on));
    else if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#foot').innerHTML = `Расписание · ${esc(DATA.updated)}<br>Собрано из ${esc(DATA.source)}${DATA.built ? ' · ' + esc(DATA.built) : ''}`;
  document.dispatchEvent(new CustomEvent('tabchange', { detail: state.tab }));
}

function persist() { store.save({ spec: state.spec, course: state.course, sub: state.sub, tab: state.tab }); }

$$('[data-tab]').forEach(b => b.addEventListener('click', () => {
  const order = ['today', 'week', 'search', 'info'];
  const from = order.indexOf(state.tab), to = order.indexOf(b.dataset.tab);
  if (to < 0 || to === from) {
    if (to === from) window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  let x = 0;
  try {
    const cur = getComputedStyle($('#view')).transform;
    if (cur && cur !== 'none') x = new DOMMatrixReadOnly(cur).m41;
  } catch (err) {}
  if (window.__slideTo) {
    window.__slideTo(to, to > from ? 'right' : 'left', x);
  } else {
    state.tab = b.dataset.tab;
    persist();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}));

/* ---------- swipe: вкладки влево/вправо с «протягиванием» панели ---------- */
(function () {
  const TABS = ['today', 'week', 'search', 'info'];
  const SKIP = 'input, textarea, select, option, [contenteditable="true"], .dayfilter';
  const view = $('#view');
  const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  const EASE = 'cubic-bezier(.22,.61,.36,1)';
  const DUR = 320;

  let sx = 0, sy = 0, tracking = false, dragging = false, lastX = 0, baseX = 0;
  let suppressClick = false, clickTimer = 0, resetTimer = 0;
  let slideSeq = 0, viewAnim = null;

  const width = () => Math.min(window.innerWidth || 360, 680);
  const tabIndex = () => TABS.indexOf(state.tab);
  const cancelAnim = () => {
    if (viewAnim) { try { viewAnim.cancel(); } catch (err) {} viewAnim = null; }
  };
  const currentX = () => {
    try {
      const t = getComputedStyle(view).transform;
      if (t && t !== 'none') return new DOMMatrixReadOnly(t).m41 || 0;
    } catch (err) {}
    return 0;
  };
  const naturalOpacity = el => {
    const v = parseFloat(getComputedStyle(el).opacity);
    return isFinite(v) ? v : 1;
  };

  function resetStyles() {
    clearTimeout(resetTimer);
    view.classList.remove('dragging');
    view.style.transition = '';
    view.style.transform = '';
    view.style.opacity = '';
    view.style.animation = '';
    view.style.willChange = '';
  }

  /* общее начало жеста (touch и mouse/pointer) */
  function begin(x, y, target) {
    if (tracking) return;
    if (target && target.closest && target.closest(SKIP)) return;
    clearTimeout(clickTimer);
    suppressClick = false;
    sx = x; sy = y;
    tracking = true; dragging = false;
  }

  function move(x, y, e) {
    if (!tracking) return;
    const dx = x - sx, dy = y - sy;
    if (!dragging) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy) * 1.2) return; // жест больше похож на вертикальный скролл
      dragging = true;
      suppressClick = true;
      document.querySelectorAll('.swipe-ghost').forEach(g => g.remove());
      if (viewAnim) {
        // предыдущий переход ещё едет — мгновенно доводим его до конца,
        // чтобы не тащить панель из-за края экрана
        cancelAnim();
        view.style.transition = 'none';
        view.style.transform = 'translate3d(0px,0,0)';
        view.style.opacity = '';
        baseX = 0;
      } else {
        // если панель ещё ехала после прошлого переключения — подхватываем её на месте
        baseX = currentX();
        cancelAnim();
        view.style.transition = 'none';
        view.style.transform = `translate3d(${baseX}px,0,0)`;
        view.style.opacity = '';
      }
      clearTimeout(resetTimer);
      slideSeq++;
      view.style.willChange = 'transform';
      view.classList.remove('enter-left', 'enter-right', 'anim');
      view.classList.add('dragging');
    }
    if (e && e.cancelable) e.preventDefault(); // не даём странице/WebView утащить жест
    const i = tabIndex();
    const edge = (dx < 0 && i >= TABS.length - 1) || (dx > 0 && i <= 0);
    const max = width() * 0.72;
    const x2 = Math.max(-max, Math.min(max, baseX + dx * (edge ? 0.26 : 1)));
    lastX = x2;
    view.style.transform = `translate3d(${x2}px,0,0)`;
  }

  function end(x, y) {
    if (!tracking) return;
    tracking = false;
    const wasDragging = dragging;
    dragging = false;
    if (!wasDragging) return;

    clickTimer = setTimeout(() => { suppressClick = false; }, 350);

    const dx = x - sx, dy = y - sy;
    const i = tabIndex();
    const threshold = Math.min(96, width() * 0.2);
    const horizontal = Math.abs(dx) > Math.abs(dy) * 1.2;
    const canMove = (dx < 0 && i < TABS.length - 1) || (dx > 0 && i > 0);

    if (horizontal && Math.abs(dx) > threshold && canMove) {
      slideTo(dx < 0 ? i + 1 : i - 1, dx < 0 ? 'right' : 'left', lastX);
    } else {
      snapBack();
    }
  }

  function cancel() {
    if (!tracking) return;
    const wasDragging = dragging;
    tracking = false;
    dragging = false;
    if (wasDragging) snapBack();
  }

  function snapBack() {
    const from = lastX;
    cancelAnim();
    if (typeof view.animate === 'function') {
      const seq = slideSeq;
      const a = view.animate(
        [{ transform: `translate3d(${from}px,0,0)` }, { transform: 'translate3d(0px,0,0)' }],
        { duration: 300, easing: EASE, fill: 'forwards' }
      );
      viewAnim = a;
      let done = false;
      const finish = () => {
        if (done || seq !== slideSeq) return;
        done = true;
        viewAnim = null;
        view.style.transform = '';
        try { a.cancel(); } catch (err) {}
        resetStyles();
      };
      a.finished.then(finish).catch(() => {});
      setTimeout(finish, 700);
    } else {
      view.style.transition = 'transform .3s ' + EASE;
      view.style.transform = '';
      view.style.opacity = '';
      resetTimer = setTimeout(resetStyles, 320);
    }
  }

  function haptic() {
    try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback.selectionChanged(); } catch (err) {}
  }

  // точная копия текущей панели поверх страницы: она уезжает, открывая новую вкладку
  function makeGhost(x, rawRect) {
    // rect снимаем до сброса transform: вычитаем текущий сдвиг,
    // иначе панель-клон окажется смещённой вдвое и «прыгнет» на краю
    const raw = rawRect || view.getBoundingClientRect();
    const rect = { left: raw.left - x, top: raw.top, width: raw.width };
    const ghost = view.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    ghost.classList.remove('dragging', 'anim', 'enter-left', 'enter-right');
    ghost.classList.add('swipe-ghost');

    const src = view.querySelectorAll('input, textarea, select');
    ghost.querySelectorAll('input, textarea, select').forEach((el, i) => {
      const from = src[i];
      if (!from) return;
      if ('value' in el) el.value = from.value;
      if (el.tagName === 'SELECT') el.selectedIndex = from.selectedIndex;
    });

    ghost.style.cssText = '';
    Object.assign(ghost.style, {
      position: 'fixed',
      left: rect.left + 'px',
      top: rect.top + 'px',
      width: rect.width + 'px',
      margin: '0',
      padding: '0',
      pointerEvents: 'none',
      zIndex: '25',
      transform: `translate3d(${x}px,0,0)`,
      transition: 'none'
    });
    document.body.appendChild(ghost);
    return { ghost, rect };
  }

  function slideTo(next, dir, x) {
    document.querySelectorAll('.swipe-ghost').forEach(g => g.remove());
    cancelAnim();
    const seq = ++slideSeq;
    haptic();

    // Панель уже сдвинута пальцем. Гасим её целиком, без второй копии
    // и без отдельных «пляшущих» карточек — так ничего не дёргается.
    view.classList.remove('dragging', 'enter-left', 'enter-right', 'anim');
    view.style.transition = 'none';
    view.style.willChange = 'opacity';
    view.style.transform = `translate3d(${x}px,0,0)`;
    view.style.opacity = '1';

    let fadeOut = null, shown = false;

    function showNew() {
      if (shown || seq !== slideSeq) return;
      shown = true;

      // снимаем старую анимацию, иначе её fill:forwards может
      // снова погасить панель после завершения новой
      if (fadeOut) { try { fadeOut.cancel(); } catch (err) {} fadeOut = null; viewAnim = null; }

      // меняем содержимое, пока старая панель полностью прозрачна
      view.style.opacity = '0';
      view.style.transform = '';
      state.tab = TABS[next];
      persist();
      render();
      view.classList.remove('enter-left', 'enter-right', 'anim');
      window.scrollTo(0, 0); // мгновенно, без «подъезжающего» скролла
      view.style.opacity = '0';
      void view.offsetWidth;

      if (typeof view.animate !== 'function') {
        // запасной вариант без WAAPI
        view.style.transition = 'opacity 210ms ' + EASE;
        view.style.opacity = '1';
        setTimeout(() => {
          if (seq !== slideSeq) return;
          view.style.transition = '';
          view.style.opacity = '';
          view.style.willChange = '';
        }, 240);
        return;
      }

      // новая панель проявляется целиком...
      const fadeIn = view.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 210, easing: EASE, fill: 'forwards' }
      );
      viewAnim = fadeIn;

      // ...а карточки догоняют её лёгкой лесенкой сверху вниз.
      // Только прозрачность: никаких сдвигов, поэтому нет тряски.
      const kids = Array.from(view.children).map((el, i) => el.animate(
        [{ opacity: 0 }, { opacity: naturalOpacity(el) }],
        { duration: 190, delay: Math.min(i, 6) * 32, easing: EASE, fill: 'both' }
      ));

      const all = [fadeIn].concat(kids);
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        if (seq === slideSeq) {
          viewAnim = null;
          view.style.transform = '';
          view.style.opacity = '';
          view.style.transition = '';
          view.style.animation = '';
          view.style.willChange = '';
        }
        all.forEach(a => { try { a.cancel(); } catch (err) {} });
      };
      Promise.allSettled(all.map(a => a.finished)).then(finish);
      setTimeout(finish, 900); // страховка, если анимация не доиграет
    }

    if (typeof view.animate === 'function') {
      try {
        fadeOut = view.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: 170, easing: 'ease-out', fill: 'forwards' }
        );
        viewAnim = fadeOut;
        fadeOut.finished.then(showNew).catch(() => {});
        // страховка: даже если анимация не доиграет, вкладка всё равно переключится
        setTimeout(showNew, 220);
        return;
      } catch (err) {
        fadeOut = null;
        viewAnim = null;
      }
    }

    // запасной вариант без WAAPI
    view.style.transition = 'opacity 170ms ease-out';
    view.style.opacity = '0';
    setTimeout(() => {
      if (seq !== slideSeq) { view.style.transition = ''; return; }
      showNew();
    }, 180);
  }

  window.__slideTo = slideTo;

  /* --- touch: работает в WebView Telegram, даже если pointer-события гасятся --- */
  view.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    begin(t.clientX, t.clientY, e.target);
  }, { passive: true });

  view.addEventListener('touchmove', e => {
    if (!tracking || e.touches.length !== 1) return;
    const t = e.touches[0];
    move(t.clientX, t.clientY, e);
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (!tracking) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) { cancel(); return; }
    end(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('touchcancel', cancel, { passive: true });

  /* --- mouse / pen: pointer-события (touch ведём отдельно) --- */
  view.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && hasTouch) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    begin(e.clientX, e.clientY, e.target);
  });

  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && hasTouch) return;
    move(e.clientX, e.clientY, e);
  });

  window.addEventListener('pointerup', e => {
    if (e.pointerType === 'touch' && hasTouch) return;
    end(e.clientX, e.clientY);
  });

  window.addEventListener('pointercancel', e => {
    if (e.pointerType === 'touch' && hasTouch) return;
    cancel();
  });

  // после протягивания не даём случайному клику открыть карточку
  view.addEventListener('click', e => {
    if (!suppressClick) return;
    suppressClick = false;
    clearTimeout(clickTimer);
    e.preventDefault();
    e.stopPropagation();
  }, true);
})();

render();
const egg = $('#eggpix');
if (egg) egg.addEventListener('error', () => egg.parentElement.remove());

setInterval(() => {
  if (state.tab === 'today') {
    const before = $('#view').innerHTML;
    renderToday();
    if (before === $('#view').innerHTML) return;
  }
}, 30000);
</script>
<script id="tg-app">/* Telegram Mini App: тема, кнопка «назад», синхронизация группы через CloudStorage.
   Подключается после основного скрипта страницы и использует его переменные
   (state, store, KEY, SPECS, render, persist). Вне Telegram ничего не делает. */
(function () {
  'use strict';

  function isDarkColor(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return true;
    var n = parseInt(m[1], 16);
    return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000 < 128;
  }

  function applyTheme(tg) {
    // доверяем только реально пришедшим themeParams: colorScheme по
    // умолчанию бывает 'light' ещё до ответа Telegram, из-за этого
    // тёмная тема сначала становилась светлой, а потом резко темнела
    var bgParam = tg.themeParams && tg.themeParams.bg_color;
    var scheme = null;
    if (bgParam) scheme = isDarkColor(bgParam) ? 'dark' : 'light';
    else if (tg.colorScheme === 'dark') scheme = 'dark';
    if (!scheme) return;

    document.documentElement.dataset.theme = scheme;
    try { localStorage.setItem('smus-theme', scheme); } catch (e) {}
    try {
      var c = scheme === 'light' ? '#f4f5fa' : '#0c0d12';
      tg.setHeaderColor(c);
      tg.setBackgroundColor(c);
    } catch (e) {}
  }

  function cloudSync(tg) {
    var CS = tg.CloudStorage;
    if (!CS) return;

    function push() {
      try {
        CS.setItem(KEY, JSON.stringify({ spec: state.spec, course: state.course, sub: state.sub, tab: state.tab }));
      } catch (e) {}
    }

    // любое изменение выбора — в облако
    var save = store.save.bind(store);
    store.save = function (o) { save(o); push(); };

    // при открытии подтягиваем выбор с другого устройства
    CS.getItem(KEY, function (err, val) {
      if (err || !val) { push(); return; }
      var o = null;
      try { o = JSON.parse(val); } catch (e) { return; }
      if (!o || !SPECS[o.spec] || !o.course) return;
      var spec = +o.spec, course = String(o.course), sub = o.sub || null;
      if (spec === state.spec && course === state.course && sub === state.sub) return;
      Object.assign(state, { spec: spec, course: course, sub: sub });
      state.sub = sub;
      render();
    });
  }

  function backButton(tg) {
    var BB = tg.BackButton;
    if (!BB) return;

    function sync() {
      if (state.tab === 'today') BB.hide();
      else BB.show();
    }

    BB.onClick(function () {
      state.tab = 'today';
      persist();
      render();
      window.scrollTo({ top: 0 });
      sync();
    });

    document.addEventListener('tabchange', sync);

    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
      b.addEventListener('click', function () {
        sync();
        try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
      });
    });

    sync();
  }

  function init() {
    var tg = window.Telegram && window.Telegram.WebApp;
    // в обычном браузере initData пустой — оставляем страницу как есть
    if (!tg || !tg.initData) return false;
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    document.body.classList.add('tg-app');
    applyTheme(tg);
    if (tg.onEvent) tg.onEvent('themeChanged', function () { applyTheme(tg); });
    cloudSync(tg);
    backButton(tg);
    return true;
  }

  // для проверки: можно вызвать вручную с подставным Telegram.WebApp
  window.__tgInit = init;
  if (!init()) window.addEventListener('load', init, { once: true });
})();
</script>
